<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kr8 Digital</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; width:100%; background:#07090a; overflow:hidden;
    font-family:'Segoe UI', system-ui, sans-serif;}

  #hero{position:relative; height:100vh; height:100dvh; width:100%; overflow:hidden; background:#07090a;}
  #heroVideo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}

  @media (max-aspect-ratio: 4/5){
    #heroVideo{object-fit:contain; background:#07090a; transform:scale(1.7); transform-origin:center;}
  }

  nav{position:fixed; top:0; right:0; z-index:10;
    padding:24px 28px; padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-right:calc(28px + env(safe-area-inset-right,0px));}

  .btn{
    position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    padding:11px 26px;
    font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
    color:#f2f1ee; text-decoration:none;
    border-radius:999px;
    background:linear-gradient(160deg, #3a3a42 0%, #16161a 45%, #38383f 100%);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.35),
      inset 0 -2px 4px rgba(0,0,0,0.6),
      0 0 0 1px rgba(0,0,0,0.4),
      0 4px 14px rgba(0,0,0,0.5),
      0 0 18px rgba(139,92,246,0.35),
      0 0 26px rgba(245,165,36,0.15);
    transition:box-shadow .3s ease, transform .2s ease, background .3s ease;
  }
  .btn:hover{
    transform:translateY(-1px);
    background:linear-gradient(160deg, #46464f 0%, #1c1c21 45%, #46464f 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.4),
      inset 0 -2px 4px rgba(0,0,0,0.6),
      0 0 0 1px rgba(0,0,0,0.4),
      0 6px 18px rgba(0,0,0,0.55),
      0 0 26px rgba(139,92,246,0.55),
      0 0 40px rgba(245,165,36,0.3);
  }
</style>
</head>
<body>

<section id="hero">
  <video id="heroVideo" autoplay muted loop playsinline>
    <source src="kr8-hero.mp4" type="video/mp4">
  </video>
</section>

<nav>
  <a class="btn" href="mailto:kr8digital@proton.me">Contact</a>
</nav>

</body>
</html>
